# Every day: download new activities from Strava, save them, and publish the website.
# Run it by hand on GitHub: Actions → "Update summit book" → "Run workflow".
name: Update summit book

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC (05:17 in Innsbruck in summer)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # save the downloaded data back into the repository
  pages: write
  id-token: write

concurrency:
  group: summitbook
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Restore OpenStreetMap peaks and huts
        uses: actions/cache@v6
        with:
          path: .cache
          key: osm-${{ github.run_id }}
          restore-keys: osm-

      - name: Download new activities and build the website
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: uv run summitbook update

      - name: Save the downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update summit book data"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
