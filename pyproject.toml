[project]
name = "summitbook"
version = "0.1.0"
description = "A summit book website built from your Strava ski tours and hikes"
readme = "README.md"
authors = [
    { name = "Xaver Leitner", email = "leitner.xaver@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fitdecode>=0.11.0",
    "pillow>=12.3.0",
]

[project.scripts]
summitbook = "summitbook.cli:main"

[project.optional-dependencies]
previews = [
    "playwright>=1.55",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
